name: Build and Test Compressor for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install UWP C++ tools (XAML compiler needs the UWP toolset)
      run: '& "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --quiet --wait --norestart'

    - name: Restore NuGet packages (packages.config)
      run: |
        curl -sL -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
        .\nuget.exe restore app\packages.config -PackagesDirectory app\packages


    - name: Configure (engine + contract test; MSBuild drives the WinUI app)
      run: cmake -S . -B build -A x64

    - name: Build engine, contract test and WinUI app
      run: cmake --build build --config Release --target winui_app contract_test -j2


    - name: Run contract tests (anti-corruption gate)
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: "E2E: executable round trip (headless mode)"
      shell: pwsh
      run: |
        $exe = "app\x64\Release\CompressorWindows\CompressorWindows.exe"
        $bytes = New-Object byte[] 100000
        (New-Object System.Random(42)).NextBytes($bytes)
        [System.IO.File]::WriteAllBytes("e2e_in.bin", $bytes)
        $p = Start-Process -FilePath $exe -ArgumentList "compress","e2e_in.bin","e2e_out.cpz","ans" -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "headless compress failed: $($p.ExitCode)" }
        $p = Start-Process -FilePath $exe -ArgumentList "decompress","e2e_out.cpz","e2e_back.bin" -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "headless decompress failed: $($p.ExitCode)" }
        $a = [System.IO.File]::ReadAllBytes("e2e_in.bin")
        $b = [System.IO.File]::ReadAllBytes("e2e_back.bin")
        if ($a.Length -ne $b.Length) { throw "E2E size mismatch" }
        for ($i = 0; $i -lt $a.Length; $i++) { if ($a[$i] -ne $b[$i]) { throw "E2E byte mismatch at $i" } }
        Write-Host "E2E ROUND TRIP OK"

    - name: "UI test: real window performs compress + decompress (--uitest)"
      shell: pwsh
      run: |
        $exe = "app\x64\Release\CompressorWindows\CompressorWindows.exe"
        $text = [System.Text.Encoding]::UTF8.GetBytes(("the quick brown fox jumps over the lazy dog 0123456789\n" * 1500))
        $rand = New-Object byte[] 20000
        (New-Object System.Random(99)).NextBytes($rand)
        $bytes = $text + $rand
        [System.IO.File]::WriteAllBytes("ui_in.bin", $bytes)
        $p = Start-Process -FilePath $exe -ArgumentList "--uitest","compress","--in","ui_in.bin","--out","ui_out.cpz","--result","ui_compress.result","--codec","ans" -Wait -PassThru -NoNewWindow
        $r = Get-Content "ui_compress.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "UI compress failed: $r" }
        $outLen = (Get-Item "ui_out.cpz").Length
        if ($outLen -ge $bytes.Length) { throw "UI compression did not shrink input ($outLen >= $($bytes.Length))" }
        $p = Start-Process -FilePath $exe -ArgumentList "--uitest","decompress","--in","ui_out.cpz","--out","ui_back.bin","--result","ui_decompress.result" -Wait -PassThru -NoNewWindow
        $r = Get-Content "ui_decompress.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "UI decompress failed: $r" }
        $a = [System.IO.File]::ReadAllBytes("ui_in.bin")
        $b = [System.IO.File]::ReadAllBytes("ui_back.bin")
        if ($a.Length -ne $b.Length) { throw "UI test size mismatch" }
        for ($i = 0; $i -lt $a.Length; $i++) { if ($a[$i] -ne $b[$i]) { throw "UI test byte mismatch at $i" } }
        Write-Host "UI TEST ROUND TRIP OK"

    - name: "Archive test: headless create/verify + UI-driven create/verify/extract"
      shell: pwsh
      run: |
        function Invoke-App([string[]]$args) {
          $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru -NoNewWindow
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "app timed out: $($args -join ' ')" }
          return $p
        }
        $exe = "app\x64\Release\CompressorWindows\CompressorWindows.exe"
        [System.IO.File]::WriteAllBytes("arch_a.bin", [System.Text.Encoding]::UTF8.GetBytes(("archive payload A alpha beta gamma\n" * 300)))
        [System.IO.File]::WriteAllBytes("arch_b.bin", [System.Text.Encoding]::UTF8.GetBytes(("archive payload B delta epsilon zeta\n" * 400)))
        $p = Start-Process -FilePath $exe -ArgumentList @("archive","create") -PassThru -NoNewWindow -RedirectStandardOutput "dbg_out.txt" -RedirectStandardError "dbg_err.txt"
        if (-not $p.WaitForExit(30000)) { Stop-Process -Id $p.Id -Force; throw "usage probe timed out" }
        Write-Host "usage probe exit: $($p.ExitCode)"
        Get-Content "dbg_out.txt","dbg_err.txt" -ErrorAction SilentlyContinue
        $p = Invoke-App @("archive","create","headless_test.cza","arch_a.bin","arch_b.bin")
        if ($p.ExitCode -ne 0) { throw "headless archive create failed: $($p.ExitCode)" }
        $p = Invoke-App @("archive","verify","headless_test.cza")
        if ($p.ExitCode -ne 0) { throw "headless archive verify failed: $($p.ExitCode)" }
        New-Item -ItemType Directory -Force -Path ui_extract_dir | Out-Null
        $p = Invoke-App @("--uitest","archive-create","--in","ui_test.cza","--files","arch_a.bin,arch_b.bin","--result","ui_arch_create.result")
        $r = Get-Content "ui_arch_create.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "UI archive create failed: $r" }
        $p = Invoke-App @("--uitest","archive-verify","--in","ui_test.cza","--result","ui_arch_verify.result")
        $r = Get-Content "ui_arch_verify.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "UI archive verify failed: $r" }
        $p = Invoke-App @("--uitest","archive-extract","--in","ui_test.cza","--out","ui_extract_dir","--entry","0","--result","ui_arch_extract.result")
        $r = Get-Content "ui_arch_extract.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "UI archive extract failed: $r" }
        $extracted = Get-ChildItem ui_extract_dir -Recurse -File | Select-Object -First 1
        if (-not $extracted) { throw "UI archive extract produced no files" }
        Write-Host "ARCHIVE TESTS OK"

