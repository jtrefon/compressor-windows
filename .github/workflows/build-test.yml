name: Build and Test Compressor for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure (engine + contract test; MSBuild drives the WinUI app)
      run: cmake -S . -B build -A x64

    - name: Build engine, contract test and WinUI app
      run: cmake --build build --config Release --target winui_app contract_test -j2

    - name: Run contract tests (anti-corruption gate)
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: Verify engine pin is an exact tag
      run: |
        findstr /R /C:"COMPRESSIONLIB_TAG \"v[0-9]*\.[0-9]*\.[0-9]*\"" CMakeLists.txt >nul || (echo engine must be pinned to an exact vX.Y.Z tag & exit /b 1)