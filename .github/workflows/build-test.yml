name: Build and Test Compressor for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install UWP C++ tools (XAML compiler needs the UWP toolset)
      run: '& "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --quiet --wait --norestart'

    - name: Restore NuGet packages (packages.config)
      run: |
        curl -sL -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
        .\nuget.exe restore app\packages.config -PackagesDirectory app\packages

    - name: Configure (engine + contract test; MSBuild drives the WinUI app)
      run: cmake -S . -B build -A x64

    - name: Build engine, contract test and WinUI app
      run: cmake --build build --config Release --target winui_app contract_test -j2

    - name: Print generated files (debug)
      if: failure()
      shell: pwsh
      run: |
        Get-ChildItem -Path app -Recurse -Filter "CompressorWindows.h" | Select-Object -ExpandProperty FullName
        Get-ChildItem -Path app -Recurse -Filter "CompressorWindows.2.h" | Select-Object -ExpandProperty FullName
        Get-ChildItem -Path app -Recurse -Filter "*.g.hpp" | Select-Object -ExpandProperty FullName
        $h = Get-ChildItem -Path app -Recurse -Filter "CompressorWindows.2.h" | Select-Object -First 1
        if ($h) { Get-Content $h.FullName -TotalCount 30 }
        Get-ChildItem -Path app -Recurse -Filter "*.winmd" | Select-Object -ExpandProperty FullName
        Get-ChildItem -Path app -Recurse -Filter "module.g.cpp" | Select-Object -ExpandProperty FullName

    - name: Run contract tests (anti-corruption gate)
      working-directory: build
      run: ctest -C Release --output-on-failure

