name: Build and Test Compressor for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install UWP C++ tools (XAML compiler needs the UWP toolset)
      run: '& "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --quiet --wait --norestart'

    - name: Restore NuGet packages (packages.config)
      run: |
        curl -sL -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
        .\nuget.exe restore app\packages.config -PackagesDirectory app\packages

    - name: Configure (engine + contract test; MSBuild drives the WinUI app)
      run: cmake -S . -B build -A x64

    - name: Build engine, contract test and WinUI app
      run: cmake --build build --config Release --target winui_app contract_test -j2


    - name: Run contract tests (anti-corruption gate)
      working-directory: build
      run: ctest -C Release --output-on-failure

    - name: "E2E: executable round trip (headless mode)"
      shell: pwsh
      run: |
        $exe = "app\x64\Release\CompressorWindows\CompressorWindows.exe"
        $bytes = New-Object byte[] 100000
        (New-Object System.Random(42)).NextBytes($bytes)
        [System.IO.File]::WriteAllBytes("e2e_in.bin", $bytes)
        $p = Start-Process -FilePath $exe -ArgumentList "compress","e2e_in.bin","e2e_out.cpz","ans" -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "headless compress failed: $($p.ExitCode)" }
        $p = Start-Process -FilePath $exe -ArgumentList "decompress","e2e_out.cpz","e2e_back.bin" -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "headless decompress failed: $($p.ExitCode)" }
        $a = [System.IO.File]::ReadAllBytes("e2e_in.bin")
        $b = [System.IO.File]::ReadAllBytes("e2e_back.bin")
        if ($a.Length -ne $b.Length) { throw "E2E size mismatch" }
        for ($i = 0; $i -lt $a.Length; $i++) { if ($a[$i] -ne $b[$i]) { throw "E2E byte mismatch at $i" } }
        Write-Host "E2E ROUND TRIP OK"

