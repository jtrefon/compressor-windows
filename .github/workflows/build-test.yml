name: Build and Test Compressor for Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt (aqtinstall)
      run: |
        python -m pip install --quiet aqtinstall
        python -m aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 --outputdir "${{ runner.temp }}/Qt"
      shell: bash

    - name: Locate Qt
      id: qt
      shell: pwsh
      run: |
        $cfg = Get-ChildItem -Path ${{ runner.temp }}/Qt -Recurse -Filter Qt6Config.cmake | Select-Object -First 1
        if (-not $cfg) { throw "Qt6Config.cmake not found under ${{ runner.temp }}/Qt" }
        "QT6_DIR=$($cfg.DirectoryName)" | Out-File -Append $env:GITHUB_ENV

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQt6_DIR=$env:QT6_DIR
      shell: pwsh

    - name: Build
      run: cmake --build build --config Release -j2

    - name: Run contract tests (anti-corruption gate)
      working-directory: build
      run: ctest --output-on-failure

    - name: Verify engine pin is an exact tag
      run: |
        grep -q 'GIT_TAG        v' CMakeLists.txt || { echo "engine must be pinned to an exact tag"; exit 1; }