name: Release Compressor for Windows

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
    steps:
    - uses: actions/checkout@v4

    - name: Install UWP C++ tools (XAML compiler needs the UWP toolset)
      run: '& "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\18\Enterprise" --add Microsoft.VisualStudio.ComponentGroup.UWP.VC --quiet --wait --norestart'

    - name: Restore NuGet packages (packages.config)
      run: |
        curl -sL -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe
        .\nuget.exe restore app\packages.config -PackagesDirectory app\packages

    - name: Configure
      run: cmake -S . -B build -A x64

    - name: Build engine, contract test and WinUI app
      run: cmake --build build --config Release --target winui_app contract_test -j2

    - name: Run contract tests (do not release a broken build)
      working-directory: build
      run: ctest -C Release --output-on-failure

    # --- Packaging: standalone executable + portable zip + installer ---
    - name: Stage standalone app directory
      run: |
        New-Item -ItemType Directory -Force -Path dist\CompressorWindows | Out-Null
        Copy-Item app\x64\Release\CompressorWindows\* dist\CompressorWindows\ -Recurse
        $vc = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC145.CRT\*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
        if ($vc) { Copy-Item (Join-Path (Split-Path $vc.FullName) '*.dll') dist\CompressorWindows\ }
        if (-not (Test-Path dist\CompressorWindows\CompressorWindows.exe)) { throw "app exe missing" }

    - name: Build portable zip
      run: Compress-Archive -Path dist\CompressorWindows -DestinationPath dist\CompressorWindows-${{ github.ref_name }}.zip

    - name: Install NSIS
      run: choco install nsis -y --no-progress

    - name: Build installer
      run: '& "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ github.ref_name }} installer.nsi'

    # --- Verify BEFORE signing ---
    - name: "E2E: staged portable executable round trip (headless mode)"
      shell: pwsh
      run: |
        $exe = "dist\CompressorWindows\CompressorWindows.exe"
        $bytes = New-Object byte[] 50000
        (New-Object System.Random(7)).NextBytes($bytes)
        [System.IO.File]::WriteAllBytes("e2e_in.bin", $bytes)
        $p = Start-Process -FilePath $exe -ArgumentList "compress","e2e_in.bin","e2e_out.cpz","optimized" -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "staged compress failed: $($p.ExitCode)" }
        $p = Start-Process -FilePath $exe -ArgumentList "decompress","e2e_out.cpz","e2e_back.bin" -Wait -PassThru -NoNewWindow
        if ($p.ExitCode -ne 0) { throw "staged decompress failed: $($p.ExitCode)" }
        $a = [System.IO.File]::ReadAllBytes("e2e_in.bin")
        $b = [System.IO.File]::ReadAllBytes("e2e_back.bin")
        if ($a.Length -ne $b.Length) { throw "E2E size mismatch" }
        for ($i = 0; $i -lt $a.Length; $i++) { if ($a[$i] -ne $b[$i]) { throw "E2E byte mismatch at $i" } }
        Write-Host "STAGED E2E ROUND TRIP OK"

    - name: Verify installer installs and uninstalls
      shell: pwsh
      run: |
        $inst = "C:\CompressorWindowsTest"
        Start-Process -Wait -FilePath "CompressorWindows-${{ github.ref_name }}-setup.exe" -ArgumentList "/S", "/D=$inst"
        if (-not (Test-Path "$inst\CompressorWindows.exe")) { throw "installer did not install the exe" }
        if (-not (Test-Path "$inst\uninstall.exe")) { throw "installer did not install the uninstaller" }
        $p = Start-Process -FilePath "$inst\CompressorWindows.exe" -PassThru
        Start-Sleep -Seconds 5
        if ($p.HasExited) { throw "installed app exited immediately (runtime missing?)" }
        Stop-Process -Id $p.Id -Force
        Start-Sleep -Seconds 1
        $text = [System.Text.Encoding]::UTF8.GetBytes(("the quick brown fox jumps over the lazy dog 0123456789\n" * 1200))
        $rand = New-Object byte[] 12000
        (New-Object System.Random(11)).NextBytes($rand)
        $bytes = $text + $rand
        [System.IO.File]::WriteAllBytes("ui_inst_in.bin", $bytes)
        $q = Start-Process -FilePath "$inst\CompressorWindows.exe" -ArgumentList "--uitest","compress","--in","ui_inst_in.bin","--out","ui_inst_out.cpz","--result","ui_inst_compress.result","--codec","bwt2" -Wait -PassThru -NoNewWindow
        $r = Get-Content "ui_inst_compress.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "installed UI compress failed: $r" }
        $outLen = (Get-Item "ui_inst_out.cpz").Length
        if ($outLen -ge $bytes.Length) { throw "installed UI compression did not shrink input ($outLen >= $($bytes.Length))" }
        $q = Start-Process -FilePath "$inst\CompressorWindows.exe" -ArgumentList "--uitest","decompress","--in","ui_inst_out.cpz","--out","ui_inst_back.bin","--result","ui_inst_decompress.result" -Wait -PassThru -NoNewWindow
        $r = Get-Content "ui_inst_decompress.result" -ErrorAction Stop
        if (-not $r.StartsWith("OK")) { throw "installed UI decompress failed: $r" }
        $a = [System.IO.File]::ReadAllBytes("ui_inst_in.bin")
        $b = [System.IO.File]::ReadAllBytes("ui_inst_back.bin")
        if ($a.Length -ne $b.Length) { throw "installed UI size mismatch" }
        for ($i = 0; $i -lt $a.Length; $i++) { if ($a[$i] -ne $b[$i]) { throw "installed UI byte mismatch at $i" } }
        Write-Host "INSTALLED UI WORKFLOW OK"
        & "$inst\uninstall.exe" /S
        Start-Sleep -Seconds 3
        if (Test-Path "$inst") { throw "uninstaller did not remove the install directory" }
        Write-Host "INSTALLER VERIFICATION OK"

    # --- Signing: prefer SignPath (free OSS), fall back to PFX, then unsigned ---
    - name: Upload artifacts for signing
      if: ${{ env.SIGNPATH_API_TOKEN != '' }}
      id: upload
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/CompressorWindows/CompressorWindows.exe
          CompressorWindows-${{ github.ref_name }}-setup.exe
        retention-days: 1

    - name: Sign via SignPath Foundation
      if: ${{ env.SIGNPATH_API_TOKEN != '' }}
      id: signpath
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
        project-slug: Windows_Compressor
        signing-policy-slug: Windows_Compressor
        github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
        artifact-configuration-slug: Windows_Compressor
        wait-for-completion: true
        output-artifact-directory: signed

    - name: Apply signed artifacts (SignPath)
      if: ${{ env.SIGNPATH_API_TOKEN != '' }}
      shell: pwsh
      run: |
        $signed = "signed"
        if (-not (Test-Path "$signed")) { throw "SignPath output directory missing" }
        # Replace unsigned exe with signed version
        $signedExe = Get-ChildItem "$signed\CompressorWindows.exe" -ErrorAction SilentlyContinue
        if ($signedExe) {
          Copy-Item $signedExe.FullName "dist\CompressorWindows\CompressorWindows.exe" -Force
          Write-Host "APPLIED SIGNED EXE"
        } else {
          Write-Host "WARNING: signed exe not found in SignPath output"
        }
        # Replace unsigned installer with signed version
        $signedSetup = Get-ChildItem "$signed\*setup.exe" -ErrorAction SilentlyContinue
        if ($signedSetup) {
          Copy-Item $signedSetup.FullName "CompressorWindows-${{ github.ref_name }}-setup.exe" -Force
          Write-Host "APPLIED SIGNED INSTALLER"
        } else {
          Write-Host "WARNING: signed installer not found in SignPath output"
        }
        # Repackage portable zip with signed exe
        Compress-Archive -Path dist\CompressorWindows -DestinationPath dist\CompressorWindows-${{ github.ref_name }}.zip -Force
        Write-Host "REPACKAGED ZIP WITH SIGNED EXE"

    - name: Sign executable (legacy PFX; fallback if no SignPath)
      if: ${{ env.SIGNPATH_API_TOKEN == '' && env.SIGNING_CERT_BASE64 != '' }}
      shell: pwsh
      run: |
        $cert = "dist\code_sign.pfx"
        [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { throw "signtool not found" }
        & $signtool.FullName sign /f $cert /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v dist\CompressorWindows\CompressorWindows.exe
        if ($LASTEXITCODE -ne 0) { throw "signtool failed: $LASTEXITCODE" }
        & $signtool.FullName sign /f $cert /p $env:SIGNING_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /v CompressorWindows-${{ github.ref_name }}-setup.exe
        if ($LASTEXITCODE -ne 0) { throw "signtool installer failed: $LASTEXITCODE" }
        Remove-Item $cert -Force
        Compress-Archive -Path dist\CompressorWindows -DestinationPath dist\CompressorWindows-${{ github.ref_name }}.zip -Force
        Write-Host "SIGNED WITH PFX (LEGACY) + REPACKAGED ZIP"

    - name: No signing configured
      if: ${{ env.SIGNPATH_API_TOKEN == '' && env.SIGNING_CERT_BASE64 == '' }}
      shell: pwsh
      run: |
        Write-Host "NO SIGNING CONFIGURED — unsigned build"
        Write-Host "See docs/SIGNING.md to enable SignPath (free) or PFX signing"

    # --- Checksums + publish ---
    - name: Compute checksums
      run: |
        Get-FileHash -Algorithm SHA256 dist\CompressorWindows-${{ github.ref_name }}.zip | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Split('\')[-1])" } | Out-File -Encoding ascii dist\SHA256SUMS.txt
        Get-FileHash -Algorithm SHA256 CompressorWindows-${{ github.ref_name }}-setup.exe | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path.Split('\')[-1])" } | Out-File -Append -Encoding ascii dist\SHA256SUMS.txt

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/CompressorWindows-${{ github.ref_name }}.zip
          CompressorWindows-${{ github.ref_name }}-setup.exe
          dist/SHA256SUMS.txt
        generate_release_notes: true
